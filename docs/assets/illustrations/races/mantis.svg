<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Mantis family emblem</title>
  <desc id="desc">An original jade mantis with a triangular face, amber eyes, folded wings and paired sickle forelegs. A family symbol, not an in-game model.</desc>
  <defs>
    <linearGradient id="jade" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#c4e6a1"/><stop offset=".35" stop-color="#69b581"/><stop offset=".7" stop-color="#2f7c70"/><stop offset="1" stop-color="#173c4b"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f5cc"/><stop offset=".24" stop-color="#b7d99c"/><stop offset=".62" stop-color="#589d79"/><stop offset="1" stop-color="#17494b"/></linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff3be"/><stop offset=".35" stop-color="#eacb6e"/><stop offset="1" stop-color="#ae6f37"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#58ac7f" stop-opacity=".22"/><stop offset="1" stop-color="#58ac7f" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#020c17" flood-opacity=".65"/></filter>
