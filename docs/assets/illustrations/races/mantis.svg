    <path d="M309 224 292 334 310 385 330 385 348 334 331 224Z" fill="url(#jade)" stroke="#a9cd9c" stroke-width="4"/>
    <path d="M319 243 306 328 320 360 334 328 325 243Z" fill="#163f49" opacity=".58"/>
