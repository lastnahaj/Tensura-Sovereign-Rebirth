      <path d="M202 301Q152 253 151 184Q151 140 179 103Q163 182 205 229L236 253 220 286Z" fill="url(#blade)" stroke="#b1d3a3" stroke-width="4"/>
      <path d="M179 111Q163 177 193 226" fill="none" stroke="#f1f2c6" stroke-width="6" stroke-linecap="round"/>
      <path d="M199 227 187 245 212 244 204 264 227 258 215 281 233 268" fill="#e1e8b9"/>
    </g>
  </defs>
  <ellipse cx="320" cy="343" rx="240" ry="247" fill="url(#aura)"/>
