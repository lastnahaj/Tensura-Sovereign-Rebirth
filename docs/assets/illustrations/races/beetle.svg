<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Beetle family emblem</title>
  <desc id="desc">An original iridescent beetle with a split horn and six articulated legs. A family symbol, not an in-game model.</desc>
  <defs>
