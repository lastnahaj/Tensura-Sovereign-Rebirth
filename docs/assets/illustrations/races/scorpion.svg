    <radialGradient id="aura"><stop stop-color="#a47c56" stop-opacity=".21"/><stop offset="1" stop-color="#a47c56" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#030b17" flood-opacity=".7"/></filter>
