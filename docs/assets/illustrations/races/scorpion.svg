<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Scorpion family emblem</title>
  <desc id="desc">An original bronze scorpion with eight legs, two open pincers and a segmented tail curled over its back. A family symbol, not an in-game model.</desc>
