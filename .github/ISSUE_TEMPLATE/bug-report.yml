name: Bug report
description: Report a reproducible TSR gameplay, crash, or configuration problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private IPs, or other secrets. Attach the relevant log/crash section when possible.
  - type: input
    id: tsr-version
    attributes:
      label: TSR version
      placeholder: v0.1 / commit SHA / release
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Dedicated server / singleplayer / client
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...
2. ...
3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or crash report
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the current TSR version.
          required: true
        - label: I removed secrets/private information from logs.
          required: true
