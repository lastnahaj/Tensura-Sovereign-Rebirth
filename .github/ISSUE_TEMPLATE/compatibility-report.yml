name: Compatibility report
description: Report a conflict or integration problem between TSR systems/mods
title: "[Compat]: "
labels: [compatibility]
body:
  - type: input
    id: mods
    attributes:
      label: Mods/systems involved
      placeholder: Gear Evolution + YIGD
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Exact versions
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or reproduction notes
