name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements.txt -r requirements-wiki.txt

      - name: Validate manifest
        run: python scripts/validate_manifest.py

      - name: Validate documentation links
        run: python scripts/validate_docs.py

      - name: Validate generated Tensura reference
        run: python scripts/wiki/check_reference.py

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Validate rendered site links
        run: python scripts/wiki/check_built_site.py

      - name: Validate progression destinations
        run: python scripts/wiki/check_progression.py

      - name: Validate progression guides
        run: python scripts/wiki/check_progression_guides.py

      - name: Validate race reference scope
        run: python scripts/wiki/check_race_reference.py

      - name: Validate encyclopedia sections
        run: python scripts/wiki/check_wiki_sections.py

      - name: Validate skill catalogue and obtainment
        run: python scripts/wiki/check_skill_catalogue.py
