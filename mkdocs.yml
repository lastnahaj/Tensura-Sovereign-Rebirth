site_name: "Tensura: Sovereign Rebirth"
site_description: Reincarnate. Evolve. Build. Awaken. Rule.
site_url: https://tsr.infinitegamingservers.com/
repo_url: https://github.com/lastnahaj/Tensura-Sovereign-Rebirth
repo_name: lastnahaj/Tensura-Sovereign-Rebirth
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/images/crowned_slime_tsr_arcane_crest.png
  favicon: assets/images/crowned_slime_tsr_arcane_crest.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/reference.js
  - assets/javascripts/modlist.js
  - assets/javascripts/server-status.js
  - assets/javascripts/onboarding.js
  - assets/javascripts/ascension.js
  - assets/javascripts/progression.js
  - assets/javascripts/progression-guide.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lastnahaj/Tensura-Sovereign-Rebirth
  generator: false

